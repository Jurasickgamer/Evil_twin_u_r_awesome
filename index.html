<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Para Nana 🌙</title>

  <style>
    :root {
      --bg1: #070910;
      --bg2: #120d1d;
      --bg3: #20122d;
      --text: #f6f1ea;
      --soft: rgba(246, 241, 234, 0.78);
      --faint: rgba(246, 241, 234, 0.52);
      --moon: #f6ecd7;
      --glow: rgba(214, 179, 255, 0.18);
      --pink: rgba(255, 170, 210, 0.08);
      --border: rgba(255,255,255,0.08);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      min-height: 100%;
    }

    body {
      overflow: hidden;
      background:
        radial-gradient(circle at 20% 20%, rgba(90, 50, 140, 0.20), transparent 30%),
        radial-gradient(circle at 80% 30%, rgba(180, 80, 120, 0.10), transparent 25%),
        radial-gradient(circle at 50% 75%, rgba(120, 80, 180, 0.10), transparent 30%),
        linear-gradient(180deg, var(--bg1) 0%, var(--bg2) 45%, var(--bg3) 100%);
      color: var(--text);
      font-family: Georgia, "Times New Roman", serif;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .stars,
    .stars::before,
    .stars::after {
      content: "";
      position: absolute;
      inset: 0;
      display: block;
      pointer-events: none;
    }

    .stars {
      background-image:
        radial-gradient(2px 2px at 12% 18%, rgba(255,255,255,0.75), transparent 60%),
        radial-gradient(1.5px 1.5px at 24% 72%, rgba(255,255,255,0.60), transparent 60%),
        radial-gradient(2px 2px at 78% 22%, rgba(255,255,255,0.75), transparent 60%),
        radial-gradient(1.5px 1.5px at 67% 68%, rgba(255,255,255,0.55), transparent 60%),
        radial-gradient(2px 2px at 88% 54%, rgba(255,255,255,0.65), transparent 60%),
        radial-gradient(1.5px 1.5px at 34% 38%, rgba(255,255,255,0.50), transparent 60%),
        radial-gradient(2px 2px at 55% 13%, rgba(255,255,255,0.55), transparent 60%),
        radial-gradient(1.5px 1.5px at 44% 85%, rgba(255,255,255,0.60), transparent 60%),
        radial-gradient(2px 2px at 8% 56%, rgba(255,255,255,0.45), transparent 60%),
        radial-gradient(1.5px 1.5px at 92% 12%, rgba(255,255,255,0.55), transparent 60%);
      animation: twinkle 9s ease-in-out infinite alternate;
      opacity: 0.9;
    }

    .stars::before {
      background-image:
        radial-gradient(1.5px 1.5px at 16% 38%, rgba(255,255,255,0.35), transparent 60%),
        radial-gradient(2px 2px at 72% 82%, rgba(255,255,255,0.42), transparent 60%),
        radial-gradient(1px 1px at 62% 48%, rgba(255,255,255,0.40), transparent 60%),
        radial-gradient(2px 2px at 83% 74%, rgba(255,255,255,0.30), transparent 60%),
        radial-gradient(1px 1px at 29% 15%, rgba(255,255,255,0.45), transparent 60%);
      animation: twinkle 12s ease-in-out infinite alternate-reverse;
    }

    .stars::after {
      background:
        radial-gradient(circle at 50% 50%, rgba(255,255,255,0.05), transparent 55%);
      filter: blur(20px);
    }

    .mist {
      position: absolute;
      width: 60vw;
      height: 26vw;
      max-width: 800px;
      max-height: 340px;
      background:
        radial-gradient(circle at 30% 50%, rgba(215, 170, 255, 0.08), transparent 45%),
        radial-gradient(circle at 70% 45%, rgba(255, 175, 205, 0.07), transparent 40%),
        radial-gradient(circle at 50% 60%, rgba(180, 140, 255, 0.06), transparent 48%);
      filter: blur(38px);
      opacity: 0.9;
      animation: drift 12s ease-in-out infinite alternate;
      pointer-events: none;
    }

    .scene {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 920px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .moon-wrap {
      position: relative;
      width: 260px;
      height: 260px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 34px;
      animation: floatMoon 5.8s ease-in-out infinite;
    }

    .moon-halo {
      position: absolute;
      width: 250px;
      height: 250px;
      border-radius: 50%;
      background:
        radial-gradient(circle, rgba(255, 243, 214, 0.15) 0%, rgba(222, 185, 255, 0.12) 35%, rgba(255, 170, 210, 0.04) 60%, transparent 75%);
      filter: blur(10px);
      box-shadow:
        0 0 40px rgba(240, 220, 190, 0.10),
        0 0 90px rgba(210, 170, 255, 0.08),
        0 0 140px rgba(255, 170, 210, 0.05);
      animation: pulse 6s ease-in-out infinite;
    }

    .moon {
      position: relative;
      width: 158px;
      height: 158px;
      border-radius: 50%;
      background:
        radial-gradient(circle at 30% 30%, #fff9ee 0%, #f8edd7 35%, #ecdec0 68%, #d9c9a7 100%);
      box-shadow:
        inset -20px -14px 0 rgba(177, 159, 123, 0.14),
        inset 12px 10px 0 rgba(255,255,255,0.14),
        0 0 25px rgba(255, 240, 210, 0.26);
      overflow: hidden;
    }

    .crater {
      position: absolute;
      border-radius: 50%;
      background: rgba(170, 145, 110, 0.14);
      box-shadow: inset 2px 2px 4px rgba(255,255,255,0.08);
    }

    .c1 { width: 24px; height: 24px; top: 35px; left: 38px; }
    .c2 { width: 14px; height: 14px; top: 80px; left: 96px; }
    .c3 { width: 18px; height: 18px; top: 100px; left: 44px; }
    .c4 { width: 10px; height: 10px; top: 54px; left: 100px; }
    .c5 { width: 8px; height: 8px; top: 118px; left: 86px; }

    .spark {
      position: absolute;
      color: rgba(255,255,255,0.72);
      font-size: 18px;
      letter-spacing: 0;
      animation: sparkShift 6s ease-in-out infinite;
      user-select: none;
    }

    .s1 { top: 8%; left: 22%; animation-delay: 0s; }
    .s2 { top: 18%; right: 18%; animation-delay: 1.2s; }
    .s3 { bottom: 30%; left: 16%; animation-delay: 2.2s; }
    .s4 { bottom: 18%; right: 22%; animation-delay: 3.5s; }

    .content {
      width: 100%;
      max-width: 760px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
    }

    .line,
    .subline,
    .thought,
    .quote {
      opacity: 0;
      transform: translateY(14px);
      transition: opacity 1.4s ease, transform 1.4s ease;
      will-change: transform, opacity;
    }

    .show {
      opacity: 1;
      transform: translateY(0);
    }

    .line {
      font-size: clamp(1.5rem, 3.2vw, 2.55rem);
      line-height: 1.35;
      max-width: 760px;
      font-weight: 500;
      letter-spacing: 0.2px;
      text-wrap: balance;
      text-shadow: 0 0 20px rgba(0,0,0,0.12);
    }

    .subline {
      font-size: clamp(1rem, 2vw, 1.15rem);
      font-style: italic;
      color: var(--soft);
      letter-spacing: 0.4px;
    }

    .thought {
      margin-top: 14px;
      font-size: clamp(0.98rem, 1.8vw, 1.08rem);
      max-width: 630px;
      line-height: 1.8;
      color: var(--soft);
      padding: 0 18px;
    }

    .quote-box {
      margin-top: 18px;
      padding: 14px 18px;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: rgba(255,255,255,0.03);
      backdrop-filter: blur(8px);
      max-width: 680px;
    }

    .quote {
      font-size: 0.92rem;
      line-height: 1.7;
      color: var(--faint);
    }

    .quote em {
      display: block;
      margin-top: 8px;
      font-style: normal;
      opacity: 0.78;
    }

    .tiny {
      position: absolute;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.72rem;
      color: rgba(255,255,255,0.22);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      z-index: 3;
      user-select: none;
    }

    @keyframes floatMoon {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }

    @keyframes pulse {
      0%, 100% {
        transform: scale(1);
        opacity: 0.92;
      }
      50% {
        transform: scale(1.04);
        opacity: 1;
      }
    }

    @keyframes twinkle {
      0% { opacity: 0.6; }
      50% { opacity: 1; }
      100% { opacity: 0.75; }
    }

    @keyframes drift {
      0% { transform: translateX(-10px) translateY(0px); }
      100% { transform: translateX(12px) translateY(6px); }
    }

    @keyframes sparkShift {
      0%, 100% { opacity: 0.35; transform: translateY(0px) scale(1); }
      50% { opacity: 1; transform: translateY(-5px) scale(1.06); }
    }

    @media (max-width: 700px) {
      body {
        padding: 20px 16px 40px;
      }

      .moon-wrap {
        width: 210px;
        height: 210px;
        margin-bottom: 24px;
      }

      .moon-halo {
        width: 210px;
        height: 210px;
      }

      .moon {
        width: 132px;
        height: 132px;
      }

      .c1 { width: 20px; height: 20px; top: 28px; left: 30px; }
      .c2 { width: 12px; height: 12px; top: 68px; left: 82px; }
      .c3 { width: 16px; height: 16px; top: 86px; left: 34px; }
      .c4 { width: 8px; height: 8px; top: 44px; left: 86px; }
      .c5 { width: 7px; height: 7px; top: 100px; left: 72px; }

      .quote-box {
        padding: 12px 14px;
      }

      .tiny {
        bottom: 10px;
        font-size: 0.65rem;
      }
    }
  </style>
</head>

<body>
  <div class="stars"></div>
  <div class="mist"></div>

  <div class="scene">
    <div class="moon-wrap">
      <div class="moon-halo"></div>

      <div class="moon">
        <span class="crater c1"></span>
        <span class="crater c2"></span>
        <span class="crater c3"></span>
        <span class="crater c4"></span>
        <span class="crater c5"></span>
      </div>
    </div>

    <span class="spark s1">✦</span>
    <span class="spark s2">✦</span>
    <span class="spark s3">✦</span>
    <span class="spark s4">✦</span>

    <div class="content">
      <div class="line" id="line1">
        “A lua nunca precisou ser o sol para ser lembrada.”
      </div>

      <div class="subline" id="line2">
        Feliz aniversário, Nana.
      </div>

      <div class="thought" id="line3">
        Talvez algumas pessoas não iluminem o caminho.
        Só fazem a noite parecer menos vazia.
      </div>

      <div class="quote-box">
        <div class="quote" id="line4">
          “Now I am become Death, the destroyer of worlds.”
          <em>— J. Robert Oppenheimer</em>
        </div>
      </div>
    </div>
  </div>

  <div class="tiny">for one quiet night</div>

  <script>
    window.addEventListener("load", () => {
      setTimeout(() => {
        document.getElementById("line1").classList.add("show");
      }, 1400);

      setTimeout(() => {
        document.getElementById("line2").classList.add("show");
      }, 3000);

      setTimeout(() => {
        document.getElementById("line3").classList.add("show");
      }, 4800);

      setTimeout(() => {
        document.getElementById("line4").classList.add("show");
      }, 6800);
    });
  </script>
</body>
</html>
