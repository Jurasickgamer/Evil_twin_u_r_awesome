<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#05060c"
  >

  <title>Para Nana 🌙</title>

  <style>

    :root {

      --bg1: #05060c;
      --bg2: #100b19;
      --bg3: #21122d;

      --text: #f6f1ea;

      --safe-top:
        env(safe-area-inset-top, 0px);

      --safe-bottom:
        env(safe-area-inset-bottom, 0px);

      --safe-left:
        env(safe-area-inset-left, 0px);

      --safe-right:
        env(safe-area-inset-right, 0px);

    }


    * {

      margin: 0;
      padding: 0;

      box-sizing: border-box;

      -webkit-tap-highlight-color:
        transparent;

    }


    html {

      scroll-behavior: smooth;

      background:
        var(--bg1);

    }


    body {

      min-height: 100vh;
      min-height: 100dvh;

      overflow-x: hidden;

      background:

        radial-gradient(
          circle at 20% 15%,
          rgba(100, 60, 160, 0.22),
          transparent 30%
        ),

        radial-gradient(
          circle at 80% 25%,
          rgba(190, 80, 130, 0.11),
          transparent 28%
        ),

        radial-gradient(
          circle at 50% 80%,
          rgba(120, 70, 180, 0.13),
          transparent 38%
        ),

        linear-gradient(
          180deg,
          var(--bg1) 0%,
          var(--bg2) 48%,
          var(--bg3) 100%
        );

      color:
        var(--text);

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      padding-left:
        var(--safe-left);

      padding-right:
        var(--safe-right);

    }


    /* ============================= */
    /* ESTRELAS                      */
    /* ============================= */


    .stars,
    .stars::before {

      content: "";

      position: fixed;

      inset: 0;

      pointer-events: none;

    }


    .stars {

      background-image:

        radial-gradient(
          2px 2px at 12% 18%,
          white,
          transparent 60%
        ),

        radial-gradient(
          1px 1px at 24% 72%,
          white,
          transparent 60%
        ),

        radial-gradient(
          2px 2px at 78% 22%,
          white,
          transparent 60%
        ),

        radial-gradient(
          1px 1px at 67% 68%,
          white,
          transparent 60%
        ),

        radial-gradient(
          2px 2px at 88% 54%,
          white,
          transparent 60%
        ),

        radial-gradient(
          1px 1px at 34% 38%,
          white,
          transparent 60%
        ),

        radial-gradient(
          2px 2px at 55% 13%,
          white,
          transparent 60%
        ),

        radial-gradient(
          1px 1px at 44% 85%,
          white,
          transparent 60%
        ),

        radial-gradient(
          2px 2px at 8% 56%,
          white,
          transparent 60%
        ),

        radial-gradient(
          1px 1px at 92% 12%,
          white,
          transparent 60%
        );

      opacity: 0.55;

      animation:
        twinkle 8s
        ease-in-out
        infinite alternate;

    }


    .stars::before {

      background-image:

        radial-gradient(
          1px 1px at 16% 38%,
          white,
          transparent 60%
        ),

        radial-gradient(
          2px 2px at 72% 82%,
          white,
          transparent 60%
        ),

        radial-gradient(
          1px 1px at 62% 48%,
          white,
          transparent 60%
        ),

        radial-gradient(
          1px 1px at 83% 74%,
          white,
          transparent 60%
        ),

        radial-gradient(
          1px 1px at 29% 15%,
          white,
          transparent 60%
        );

      opacity: 0.45;

      animation:
        twinkle 12s
        ease-in-out
        infinite alternate-reverse;

    }


    /* ============================= */
    /* NÉVOA                         */
    /* ============================= */


    .mist {

      position: fixed;

      width: 70vw;
      height: 36vw;

      left: 50%;
      top: 40%;

      transform:
        translate(-50%, -50%);

      background:

        radial-gradient(
          circle at 30% 50%,
          rgba(215, 170, 255, 0.09),
          transparent 45%
        ),

        radial-gradient(
          circle at 70% 45%,
          rgba(255, 175, 205, 0.07),
          transparent 40%
        );

      filter:
        blur(42px);

      pointer-events: none;

      animation:
        mistMove 12s
        ease-in-out
        infinite alternate;

    }


    /* ============================= */
    /* CONTEÚDO                      */
    /* ============================= */


    main {

      position: relative;

      z-index: 2;

      width: 100%;

      min-height: 100vh;
      min-height: 100dvh;

      display: flex;

      justify-content: center;
      align-items: center;

      padding-top:
        calc(40px + var(--safe-top));

      padding-bottom:
        calc(55px + var(--safe-bottom));

      padding-left:
        18px;

      padding-right:
        18px;

    }


    .scene {

      position: relative;

      width: 100%;

      max-width: 820px;

      display: flex;

      flex-direction: column;

      align-items: center;

      justify-content: center;

      text-align: center;

    }


    /* ============================= */
    /* LUA                           */
    /* ============================= */


    .moon-wrapper {

      width:
        clamp(190px, 42vw, 260px);

      height:
        clamp(190px, 42vw, 260px);

      position: relative;

      display: flex;

      justify-content: center;
      align-items: center;

      margin-bottom:
        clamp(20px, 5vw, 32px);

      animation:
        floatMoon 6s
        ease-in-out
        infinite;

      cursor: pointer;

      touch-action:
        manipulation;

      user-select: none;

      -webkit-user-select: none;

    }


    .moon-wrapper:active {

      transform:
        scale(0.97);

    }


    .moon-halo {

      position: absolute;

      width: 100%;
      height: 100%;

      border-radius: 50%;

      background:

        radial-gradient(
          circle,
          rgba(255, 240, 210, 0.17) 0%,
          rgba(200, 160, 255, 0.13) 35%,
          rgba(255, 160, 210, 0.05) 58%,
          transparent 75%
        );

      filter:
        blur(9px);

      animation:
        moonPulse 6s
        ease-in-out
        infinite;

    }


    .moon {

      width:
        clamp(125px, 28vw, 158px);

      height:
        clamp(125px, 28vw, 158px);

      position: relative;

      border-radius: 50%;

      overflow: hidden;

      background:

        radial-gradient(
          circle at 28% 25%,
          #fffaf0 0%,
          #f7ecd6 37%,
          #ebdcbc 70%,
          #d3c09d 100%
        );

      box-shadow:

        inset -20px -14px 0
        rgba(170, 150, 120, 0.14),

        inset 10px 9px 0
        rgba(255, 255, 255, 0.12),

        0 0 25px
        rgba(255, 240, 210, 0.22),

        0 0 70px
        rgba(200, 160, 255, 0.11);

    }


    .crater {

      position: absolute;

      border-radius: 50%;

      background:
        rgba(165, 140, 105, 0.14);

    }


    .c1 {

      width: 16%;
      height: 16%;

      top: 22%;
      left: 24%;

    }


    .c2 {

      width: 9%;
      height: 9%;

      top: 51%;
      left: 61%;

    }


    .c3 {

      width: 12%;
      height: 12%;

      top: 64%;
      left: 28%;

    }


    .c4 {

      width: 7%;
      height: 7%;

      top: 34%;
      left: 65%;

    }


    .c5 {

      width: 5%;
      height: 5%;

      top: 75%;
      left: 56%;

    }


    /* ============================= */
    /* TEXTO                         */
    /* ============================= */


    .fade-item {

      opacity: 0;

      transform:
        translateY(14px);

      transition:

        opacity 1.5s ease,

        transform 1.5s ease;

    }


    .fade-item.show {

      opacity: 1;

      transform:
        translateY(0);

    }


    .birthday {

      font-size:
        clamp(1.65rem, 7vw, 3rem);

      line-height: 1.25;

      font-weight: 500;

      color:
        var(--text);

      letter-spacing:
        0.2px;

      padding-left:
        10px;

      padding-right:
        10px;

    }


    .moon-hint {

      margin-top: 12px;

      font-size:
        clamp(0.65rem, 2.7vw, 0.78rem);

      color:
        rgba(255,255,255,0.17);

      letter-spacing:
        0.08em;

      opacity: 0;

      transition:
        opacity 1.5s ease;

    }


    .moon-hint.show {

      opacity: 1;

    }


    /* ============================= */
    /* SPOTIFY                       */
    /* ============================= */


    .spotify-section {

      width: 100%;

      max-width: 560px;

      margin-top:
        clamp(30px, 8vw, 42px);

    }


    .spotify-label {

      margin-bottom: 13px;

      font-size:
        clamp(0.72rem, 2.8vw, 0.8rem);

      letter-spacing:
        0.08em;

      color:
        rgba(255, 255, 255, 0.34);

    }


    .spotify-search {

      display: flex;

      gap: 9px;

      width: 100%;

    }


    .spotify-search input {

      flex: 1;

      min-width: 0;

      padding:
        14px 17px;

      border:
        1px solid
        rgba(255,255,255,0.11);

      border-radius: 30px;

      outline: none;

      background:
        rgba(255,255,255,0.045);

      backdrop-filter:
        blur(10px);

      -webkit-backdrop-filter:
        blur(10px);

      color: white;

      font-size: 16px;

    }


    .spotify-search input::placeholder {

      color:
        rgba(255,255,255,0.30);

    }


    .spotify-search button {

      min-height: 48px;

      padding:
        12px 21px;

      border: 0;

      border-radius: 30px;

      cursor: pointer;

      background:
        rgba(245,238,225,0.90);

      color: #15131a;

      font-family: inherit;

      font-size: 0.9rem;

    }


    #spotifyMessage {

      min-height: 18px;

      margin-top: 10px;

      font-size: 0.78rem;

      color:
        rgba(255,255,255,0.42);

    }


    #spotifyPlayer {

      width: 100%;

      margin-top: 18px;

      opacity: 0;

      transform:
        translateY(12px);

      transition:

        opacity 0.8s ease,

        transform 0.8s ease;

    }


    #spotifyPlayer.visible {

      opacity: 1;

      transform:
        translateY(0);

    }


    #spotifyPlayer iframe {

      display: block;

      width: 100%;

      border: 0;

      border-radius: 14px;

    }


    /* ============================= */
    /* SHINE SURPRESA                */
    /* ============================= */


    .explosion-flash {

      position: fixed;

      inset: 0;

      z-index: 999;

      pointer-events: none;

      opacity: 0;

      background:

        radial-gradient(
          circle at center,
          rgba(255,255,220,0.95) 0%,
          rgba(255,190,40,0.70) 15%,
          rgba(255,90,20,0.38) 35%,
          transparent 65%
        );

    }


    .explosion-flash.boom {

      animation:
        flashExplosion 650ms ease-out;

    }


    .shine-text {

      position: fixed;

      z-index: 1000;

      top: 50%;
      left: 50%;

      width: 100%;

      transform:
        translate(-50%, -50%)
        scale(0.3)
        rotate(-4deg);

      padding:
        20px;

      text-align: center;

      pointer-events: none;

      opacity: 0;

      color: white;

      font-family:
        Arial Black,
        Impact,
        sans-serif;

      font-size:
        clamp(2.3rem, 13vw, 7rem);

      font-weight: 900;

      letter-spacing:
        -0.04em;

      text-shadow:

        0 3px 0 #e65a00,

        0 0 20px
        rgba(255,170,0,0.95),

        0 0 50px
        rgba(255,80,0,0.8);

    }


    .shine-text.boom {

      animation:
        shineTextBoom 900ms
        cubic-bezier(.17,.67,.18,1.2);

    }


    .moon-wrapper.explode {

      animation:
        moonExplosion 600ms
        ease-out;

    }


    /* ============================= */
    /* RODAPÉ                        */
    /* ============================= */


    .footer {

      margin-top: 42px;

      font-size:
        0.62rem;

      letter-spacing:
        0.15em;

      color:
        rgba(255,255,255,0.14);

    }


    /* ============================= */
    /* ANIMAÇÕES                     */
    /* ============================= */


    @keyframes floatMoon {

      0%,
      100% {

        transform:
          translateY(0);

      }

      50% {

        transform:
          translateY(-10px);

      }

    }


    @keyframes moonPulse {

      0%,
      100% {

        transform:
          scale(1);

        opacity:
          0.9;

      }

      50% {

        transform:
          scale(1.05);

        opacity:
          1;

      }

    }


    @keyframes twinkle {

      from {

        opacity:
          0.42;

      }

      to {

        opacity:
          0.75;

      }

    }


    @keyframes mistMove {

      from {

        transform:
          translate(-53%, -50%);

      }

      to {

        transform:
          translate(-47%, -47%);

      }

    }


    @keyframes flashExplosion {

      0% {

        opacity:
          0;

      }

      8% {

        opacity:
          1;

      }

      30% {

        opacity:
          0.75;

      }

      100% {

        opacity:
          0;

      }

    }


    @keyframes shineTextBoom {

      0% {

        opacity:
          0;

        transform:
          translate(-50%, -50%)
          scale(0.2)
          rotate(-8deg);

      }

      20% {

        opacity:
          1;

        transform:
          translate(-50%, -50%)
          scale(1.25)
          rotate(4deg);

      }

      55% {

        opacity:
          1;

        transform:
          translate(-50%, -50%)
          scale(1)
          rotate(-2deg);

      }

      100% {

        opacity:
          0;

        transform:
          translate(-50%, -50%)
          scale(1.5)
          rotate(2deg);

      }

    }


    @keyframes moonExplosion {

      0% {

        transform:
          translate(0, 0)
          scale(1);

      }

      15% {

        transform:
          translate(-9px, 3px)
          scale(1.08);

      }

      30% {

        transform:
          translate(8px, -5px)
          scale(1.1);

      }

      45% {

        transform:
          translate(-6px, -2px)
          scale(1.07);

      }

      60% {

        transform:
          translate(5px, 4px)
          scale(1.04);

      }

      100% {

        transform:
          translate(0, 0)
          scale(1);

      }

    }


    /* ============================= */
    /* IPHONE / CELULAR              */
    /* ============================= */


    @media
    (max-width: 600px) {

      main {

        align-items:
          flex-start;

        padding-top:
          calc(
            50px +
            var(--safe-top)
          );

      }


      .scene {

        min-height:
          calc(
            100dvh -
            100px
          );

        justify-content:
          center;

      }


      .spotify-search {

        flex-direction:
          column;

      }


      .spotify-search button {

        width: 100%;

      }


      .footer {

        padding-bottom:
          var(--safe-bottom);

      }

    }


    /* iPhone horizontal */

    @media
    (max-height: 500px)
    and
    (orientation: landscape) {

      main {

        padding-top:
          calc(
            20px +
            var(--safe-top)
          );

        padding-bottom:
          calc(
            30px +
            var(--safe-bottom)
          );

      }


      .moon-wrapper {

        width:
          150px;

        height:
          150px;

        margin-bottom:
          12px;

      }


      .moon {

        width:
          100px;

        height:
          100px;

      }

    }


    /* Reduz movimento se o aparelho pedir */

    @media
    (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {

        animation-duration:
          0.01ms !important;

        animation-iteration-count:
          1 !important;

      }

    }

  </style>

</head>


<body>


  <div class="stars"></div>

  <div class="mist"></div>


  <div
    id="explosionFlash"
    class="explosion-flash"
  ></div>


  <div
    id="shineText"
    class="shine-text"
  >
    SHINEEEEEEE!
  </div>


  <main>


    <div class="scene">


      <!-- LUA CLICÁVEL -->


      <div
        id="moonButton"
        class="moon-wrapper"
        role="button"
        tabindex="0"
        aria-label="Lua"
      >


        <div class="moon-halo"></div>


        <div class="moon">

          <span class="crater c1"></span>
          <span class="crater c2"></span>
          <span class="crater c3"></span>
          <span class="crater c4"></span>
          <span class="crater c5"></span>

        </div>


      </div>


      <!-- FELIZ ANIVERSÁRIO -->


      <div
        id="birthday"
        class="birthday fade-item"
      >

        Feliz aniversário, Nana.

      </div>


      <div
        id="moonHint"
        class="moon-hint"
      >

        ps: talvez a lua faça alguma coisa

      </div>


      <!-- SPOTIFY -->


      <div
        id="spotifyArea"
        class="spotify-section fade-item"
      >


        <div class="spotify-label">

          deixa alguma coisa tocar nessa noite

        </div>


        <div class="spotify-search">


          <input
            id="spotifyInput"
            type="text"
            placeholder="cole uma música ou playlist do Spotify..."
            autocomplete="off"
          >


          <button
            type="button"
            onclick="loadSpotify()"
          >

            ouvir

          </button>


        </div>


        <div id="spotifyMessage"></div>


        <div id="spotifyPlayer"></div>


      </div>


      <div class="footer">

        for one quiet night

      </div>


    </div>


  </main>


  <script>


    /* =========================================
       ENTRADA DA PÁGINA
    ========================================= */


    window.addEventListener(
      "load",
      function () {


        setTimeout(
          function () {

            document
              .getElementById("birthday")
              .classList
              .add("show");

          },
          900
        );


        setTimeout(
          function () {

            document
              .getElementById("spotifyArea")
              .classList
              .add("show");

          },
          2200
        );


        setTimeout(
          function () {

            document
              .getElementById("moonHint")
              .classList
              .add("show");

          },
          4500
        );


      }
    );


    /* =========================================
       SURPRESA DA LUA
    ========================================= */


    const moonButton =
      document.getElementById(
        "moonButton"
      );


    const explosionFlash =
      document.getElementById(
        "explosionFlash"
      );


    const shineText =
      document.getElementById(
        "shineText"
      );


    let explosionLocked =
      false;


    function triggerMoonExplosion() {


      if (
        explosionLocked
      ) {

        return;

      }


      explosionLocked =
        true;


      /* remove animação antiga */


      moonButton
        .classList
        .remove("explode");


      explosionFlash
        .classList
        .remove("boom");


      shineText
        .classList
        .remove("boom");


      void moonButton.offsetWidth;


      /* inicia efeito */


      moonButton
        .classList
        .add("explode");


      explosionFlash
        .classList
        .add("boom");


      shineText
        .classList
        .add("boom");


      /* vibração no celular,
         se o navegador permitir */


      if (
        navigator.vibrate
      ) {

        navigator.vibrate(
          [
            50,
            30,
            80
          ]
        );

      }


      /* voz do próprio aparelho */


      if (
        "speechSynthesis"
        in window
      ) {


        window
          .speechSynthesis
          .cancel();


        const scream =
          new SpeechSynthesisUtterance(
            "SHINEEEEEEEEE!"
          );


        scream.lang =
          "ja-JP";


        scream.rate =
          1.15;


        scream.pitch =
          1.35;


        scream.volume =
          1;


        window
          .speechSynthesis
          .speak(
            scream
          );


      }


      setTimeout(
        function () {


          moonButton
            .classList
            .remove("explode");


          explosionFlash
            .classList
            .remove("boom");


          shineText
            .classList
            .remove("boom");


          explosionLocked =
            false;


        },
        1100
      );


    }


    moonButton
      .addEventListener(
        "click",
        triggerMoonExplosion
      );


    moonButton
      .addEventListener(
        "keydown",
        function (event) {


          if (
            event.key === "Enter" ||
            event.key === " "
          ) {


            event.preventDefault();


            triggerMoonExplosion();


          }


        }
      );


    /* =========================================
       SPOTIFY
    ========================================= */


    function loadSpotify() {


      const input =

        document
          .getElementById(
            "spotifyInput"
          )
          .value
          .trim();


      const message =

        document
          .getElementById(
            "spotifyMessage"
          );


      const player =

        document
          .getElementById(
            "spotifyPlayer"
          );


      const match =

        input.match(

          /open\.spotify\.com\/(playlist|track|album|artist|show|episode)\/([a-zA-Z0-9]+)/

        );


      if (
        !match
      ) {


        player.innerHTML =
          "";


        player
          .classList
          .remove(
            "visible"
          );


        message.textContent =
          "esse link não parece ser do Spotify 🌙";


        return;


      }


      const type =
        match[1];


      const id =
        match[2];


      let height =
        152;


      if (

        type === "playlist" ||

        type === "album" ||

        type === "artist"

      ) {


        height =
          352;


      }


      const embedURL =

        "https://open.spotify.com/embed/" +

        type +

        "/" +

        id;


      message.textContent =
        "";


      player.innerHTML =

        `

        <iframe
          src="${embedURL}"
          height="${height}"
          allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
          loading="lazy">
        </iframe>

        `;


      setTimeout(
        function () {


          player
            .classList
            .add(
              "visible"
            );


        },
        50
      );


    }


    document
      .getElementById(
        "spotifyInput"
      )
      .addEventListener(
        "keydown",
        function (event) {


          if (
            event.key === "Enter"
          ) {


            loadSpotify();


          }


        }
      );


  </script>


</body>

</html>
