<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#05060c"
  >

  <title>Para Nana 🌙</title>

  <style>

    :root {

      --bg1: #05060c;
      --bg2: #100b19;
      --bg3: #21122d;

      --text: #f6f1ea;

      --safe-top:
        env(safe-area-inset-top, 0px);

      --safe-bottom:
        env(safe-area-inset-bottom, 0px);

      --safe-left:
        env(safe-area-inset-left, 0px);

      --safe-right:
        env(safe-area-inset-right, 0px);

    }


    * {

      margin: 0;
      padding: 0;

      box-sizing: border-box;

      -webkit-tap-highlight-color:
        transparent;

    }


    html {

      background:
        var(--bg1);

      scroll-behavior:
        smooth;

    }


    body {

      min-height: 100vh;
      min-height: 100dvh;

      overflow-x: hidden;

      background:

        radial-gradient(
          circle at 20% 15%,
          rgba(100, 60, 160, 0.22),
          transparent 30%
        ),

        radial-gradient(
          circle at 80% 25%,
          rgba(190, 80, 130, 0.11),
          transparent 28%
        ),

        radial-gradient(
          circle at 50% 80%,
          rgba(120, 70, 180, 0.13),
          transparent 38%
        ),

        linear-gradient(
          180deg,
          var(--bg1) 0%,
          var(--bg2) 48%,
          var(--bg3) 100%
        );

      color:
        var(--text);

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      padding-left:
        var(--safe-left);

      padding-right:
        var(--safe-right);

    }


    /* ===================================== */
    /* ESTRELAS DE FUNDO                     */
    /* ===================================== */


    .stars,
    .stars::before {

      content: "";

      position: fixed;

      inset: 0;

      pointer-events: none;

    }


    .stars {

      background-image:

        radial-gradient(
          2px 2px at 12% 18%,
          white,
          transparent 60%
        ),

        radial-gradient(
          1px 1px at 24% 72%,
          white,
          transparent 60%
        ),

        radial-gradient(
          2px 2px at 78% 22%,
          white,
          transparent 60%
        ),

        radial-gradient(
          1px 1px at 67% 68%,
          white,
          transparent 60%
        ),

        radial-gradient(
          2px 2px at 88% 54%,
          white,
          transparent 60%
        ),

        radial-gradient(
          1px 1px at 34% 38%,
          white,
          transparent 60%
        ),

        radial-gradient(
          2px 2px at 55% 13%,
          white,
          transparent 60%
        ),

        radial-gradient(
          1px 1px at 44% 85%,
          white,
          transparent 60%
        ),

        radial-gradient(
          2px 2px at 8% 56%,
          white,
          transparent 60%
        ),

        radial-gradient(
          1px 1px at 92% 12%,
          white,
          transparent 60%
        );

      opacity:
        0.55;

      animation:
        twinkle 8s
        ease-in-out
        infinite alternate;

    }


    .stars::before {

      background-image:

        radial-gradient(
          1px 1px at 16% 38%,
          white,
          transparent 60%
        ),

        radial-gradient(
          2px 2px at 72% 82%,
          white,
          transparent 60%
        ),

        radial-gradient(
          1px 1px at 62% 48%,
          white,
          transparent 60%
        ),

        radial-gradient(
          1px 1px at 83% 74%,
          white,
          transparent 60%
        ),

        radial-gradient(
          1px 1px at 29% 15%,
          white,
          transparent 60%
        );

      opacity:
        0.45;

      animation:
        twinkle 12s
        ease-in-out
        infinite alternate-reverse;

    }


    /* ===================================== */
    /* ESTRELAS SECRETAS                     */
    /* ===================================== */


    .secret-star {

      position: fixed;

      z-index: 20;

      width: 44px;
      height: 44px;

      border: 0;

      padding: 0;

      cursor: pointer;

      background: transparent;

      color:
        rgba(255,255,255,0.48);

      font-size: 17px;

      display: flex;

      justify-content: center;
      align-items: center;

      touch-action:
        manipulation;

      user-select: none;

      -webkit-user-select: none;

      text-shadow:
        0 0 7px
        rgba(255,255,255,0.15);

      transition:
        color 0.35s ease,
        text-shadow 0.35s ease,
        transform 0.35s ease;

      animation:
        secretStarIdle 5s
        ease-in-out
        infinite;

    }


    .secret-star:hover {

      color:
        rgba(255,255,255,0.75);

    }


    .secret-star.found {

      color:
        #fff8d8;

      text-shadow:
        0 0 6px #fff,
        0 0 15px rgba(221,190,255,0.95),
        0 0 30px rgba(255,160,210,0.65);

      transform:
        scale(1.3);

      animation:
        secretStarFound
        900ms ease;

    }


    .secret-star.used {

      pointer-events:
        none;

    }


    .secret-star-1 {

      top:
        calc(15% + var(--safe-top));

      left:
        10%;

      animation-delay:
        0s;

    }


    .secret-star-2 {

      top:
        calc(23% + var(--safe-top));

      right:
        11%;

      animation-delay:
        1.1s;

    }


    .secret-star-3 {

      bottom:
        calc(25% + var(--safe-bottom));

      left:
        12%;

      animation-delay:
        2.2s;

    }


    .secret-star-4 {

      bottom:
        calc(18% + var(--safe-bottom));

      right:
        10%;

      animation-delay:
        3.3s;

    }


    /* ===================================== */
    /* NÉVOA                                 */
    /* ===================================== */


    .mist {

      position: fixed;

      width: 70vw;
      height: 36vw;

      left: 50%;
      top: 40%;

      transform:
        translate(-50%, -50%);

      background:

        radial-gradient(
          circle at 30% 50%,
          rgba(215,170,255,0.09),
          transparent 45%
        ),

        radial-gradient(
          circle at 70% 45%,
          rgba(255,175,205,0.07),
          transparent 40%
        );

      filter:
        blur(42px);

      pointer-events: none;

      animation:
        mistMove 12s
        ease-in-out
        infinite alternate;

    }


    /* ===================================== */
    /* PÁGINA                                */
    /* ===================================== */


    main {

      position: relative;

      z-index: 2;

      width: 100%;

      min-height: 100vh;
      min-height: 100dvh;

      display: flex;

      justify-content: center;
      align-items: center;

      padding-top:
        calc(40px + var(--safe-top));

      padding-bottom:
        calc(55px + var(--safe-bottom));

      padding-left:
        18px;

      padding-right:
        18px;

    }


    .scene {

      position: relative;

      width: 100%;
      max-width: 820px;

      display: flex;

      flex-direction: column;

      align-items: center;
      justify-content: center;

      text-align: center;

    }


    /* ===================================== */
    /* LUA                                   */
    /* ===================================== */


    .moon-stage {

      position: relative;

      width:
        clamp(200px,45vw,280px);

      height:
        clamp(200px,45vw,280px);

      display: flex;

      justify-content: center;
      align-items: center;

      margin-bottom:
        clamp(20px,5vw,30px);

    }


    .moon-wrapper {

      position: relative;

      width: 100%;
      height: 100%;

      display: flex;

      justify-content: center;
      align-items: center;

      cursor: pointer;

      touch-action:
        manipulation;

      user-select: none;

      -webkit-user-select: none;

      animation:
        floatMoon 6s
        ease-in-out
        infinite;

      transition:
        opacity 0.3s ease,
        transform 0.3s ease;

    }


    .moon-halo {

      position: absolute;

      width: 100%;
      height: 100%;

      border-radius: 50%;

      background:

        radial-gradient(
          circle,
          rgba(255,240,210,0.17) 0%,
          rgba(200,160,255,0.13) 35%,
          rgba(255,160,210,0.05) 58%,
          transparent 75%
        );

      filter:
        blur(9px);

      animation:
        moonPulse 6s
        ease-in-out
        infinite;

    }


    .moon {

      position: relative;

      width:
        clamp(130px,29vw,165px);

      height:
        clamp(130px,29vw,165px);

      border-radius: 50%;

      overflow: hidden;

      background:

        radial-gradient(
          circle at 28% 25%,
          #fffaf0 0%,
          #f7ecd6 37%,
          #ebdcbc 70%,
          #d3c09d 100%
        );

      box-shadow:

        inset -20px -14px 0
        rgba(170,150,120,0.14),

        inset 10px 9px 0
        rgba(255,255,255,0.12),

        0 0 25px
        rgba(255,240,210,0.22),

        0 0 70px
        rgba(200,160,255,0.11);

    }


    .crater {

      position: absolute;

      border-radius: 50%;

      background:
        rgba(165,140,105,0.14);

    }


    .c1 {

      width: 16%;
      height: 16%;

      top: 22%;
      left: 24%;

    }


    .c2 {

      width: 9%;
      height: 9%;

      top: 51%;
      left: 61%;

    }


    .c3 {

      width: 12%;
      height: 12%;

      top: 64%;
      left: 28%;

    }


    .c4 {

      width: 7%;
      height: 7%;

      top: 34%;
      left: 65%;

    }


    .c5 {

      width: 5%;
      height: 5%;

      top: 75%;
      left: 56%;

    }


    /* ===================================== */
    /* PEDAÇOS DA LUA                        */
    /* ===================================== */


    .moon-pieces {

      position: absolute;

      inset: 0;

      display: flex;

      justify-content: center;
      align-items: center;

      pointer-events: none;

      opacity: 0;

    }


    .piece {

      position: absolute;

      width: 55px;
      height: 55px;

      border-radius:
        55% 45% 60% 40%;

      background:

        radial-gradient(
          circle at 25% 20%,
          #fffaf0 0%,
          #f7ecd6 45%,
          #d7c29e 100%
        );

      box-shadow:
        0 0 12px
        rgba(255,240,210,0.14);

      opacity: 0;

    }


    .moon-stage.exploded
    .moon-wrapper {

      opacity: 0;

      animation: none;

    }


    .moon-stage.exploded
    .moon-pieces {

      opacity: 1;

    }


    .moon-stage.exploded
    .piece1 {

      animation:
        piece1Boom
        900ms
        forwards;

    }


    .moon-stage.exploded
    .piece2 {

      animation:
        piece2Boom
        900ms
        forwards;

    }


    .moon-stage.exploded
    .piece3 {

      animation:
        piece3Boom
        900ms
        forwards;

    }


    .moon-stage.exploded
    .piece4 {

      animation:
        piece4Boom
        900ms
        forwards;

    }


    /* ===================================== */
    /* TEXTO                                 */
    /* ===================================== */


    .fade-item {

      opacity: 0;

      transform:
        translateY(14px);

      transition:
        opacity 1.5s ease,
        transform 1.5s ease;

    }


    .fade-item.show {

      opacity: 1;

      transform:
        translateY(0);

    }


    .birthday {

      font-size:
        clamp(1.65rem,7vw,3rem);

      line-height: 1.25;

      font-weight: 500;

      color:
        var(--text);

      letter-spacing:
        0.2px;

    }


    .moon-hint {

      margin-top: 12px;

      font-size:
        clamp(0.65rem,2.6vw,0.76rem);

      color:
        rgba(255,255,255,0.15);

      letter-spacing:
        0.08em;

      opacity: 0;

      transition:
        opacity 1.5s ease;

    }


    .moon-hint.show {

      opacity: 1;

    }


    /* ===================================== */
    /* EXPLOSÃO                              */
    /* ===================================== */


    .explosion-flash {

      position: fixed;

      inset: 0;

      z-index: 999;

      pointer-events: none;

      opacity: 0;

      background:

        radial-gradient(
          circle at center,
          rgba(255,255,220,0.98) 0%,
          rgba(255,200,50,0.80) 12%,
          rgba(255,100,20,0.50) 28%,
          transparent 65%
        );

    }


    .explosion-flash.boom {

      animation:
        flashExplosion
        700ms
        ease-out;

    }


    .shine-text {

      position: fixed;

      z-index: 1000;

      top: 50%;
      left: 50%;

      width: 100%;

      transform:
        translate(-50%,-50%)
        scale(0.2);

      padding: 20px;

      text-align: center;

      pointer-events: none;

      opacity: 0;

      color: white;

      font-family:
        Impact,
        "Arial Black",
        sans-serif;

      font-size:
        clamp(2.2rem,13vw,7rem);

      font-weight: 900;

      letter-spacing:
        -0.03em;

      text-shadow:

        0 3px 0
        #e65a00,

        0 0 20px
        rgba(255,170,0,0.95),

        0 0 50px
        rgba(255,80,0,0.8);

    }


    .shine-text.boom {

      animation:
        shineTextBoom
        1100ms
        cubic-bezier(.17,.67,.18,1.2);

    }


    /* ===================================== */
    /* BOTÃO RESTAURAR                       */
    /* ===================================== */


    .restore-button {

      display: none;

      margin-top: 14px;

      padding:
        11px 18px;

      border:
        1px solid
        rgba(255,255,255,0.12);

      border-radius: 30px;

      background:
        rgba(255,255,255,0.05);

      color:
        rgba(255,255,255,0.70);

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      cursor: pointer;

      backdrop-filter:
        blur(10px);

      -webkit-backdrop-filter:
        blur(10px);

    }


    .restore-button.visible {

      display: block;

      animation:
        restoreAppear
        600ms ease forwards;

    }


    /* ===================================== */
    /* SPOTIFY                               */
    /* ===================================== */


    .spotify-section {

      width: 100%;
      max-width: 560px;

      margin-top:
        clamp(30px,8vw,42px);

    }


    .spotify-label {

      margin-bottom: 13px;

      font-size:
        clamp(0.76rem,2.9vw,0.84rem);

      letter-spacing:
        0.08em;

      color:
        rgba(255,255,255,0.38);

      text-align: left;

      padding-left: 4px;

    }


    .spotify-search {

      display: flex;

      gap: 9px;

      width: 100%;

    }


    .spotify-search input {

      flex: 1;

      min-width: 0;

      padding:
        14px 17px;

      border:
        1px solid
        rgba(255,255,255,0.11);

      border-radius: 30px;

      outline: none;

      background:
        rgba(255,255,255,0.045);

      backdrop-filter:
        blur(10px);

      -webkit-backdrop-filter:
        blur(10px);

      color: white;

      font-size: 16px;

    }


    .spotify-search input::placeholder {

      color:
        rgba(255,255,255,0.30);

    }


    .spotify-search button {

      min-height: 48px;

      padding:
        12px 21px;

      border: 0;

      border-radius: 30px;

      cursor: pointer;

      background:
        rgba(245,238,225,0.90);

      color:
        #15131a;

      font-family: inherit;

      font-size: 0.9rem;

    }


    #spotifyMessage {

      min-height: 18px;

      margin-top: 10px;

      font-size: 0.78rem;

      color:
        rgba(255,255,255,0.42);

    }


    #spotifyPlayer {

      width: 100%;

      margin-top: 18px;

      opacity: 0;

      transform:
        translateY(12px);

      transition:
        opacity 0.8s ease,
        transform 0.8s ease;

    }


    #spotifyPlayer.visible {

      opacity: 1;

      transform:
        translateY(0);

    }


    #spotifyPlayer iframe {

      display: block;

      width: 100%;

      border: 0;

      border-radius: 14px;

    }


    /* ===================================== */
    /* SEGREDO DAS ESTRELAS                  */
    /* ===================================== */


    .secret-overlay {

      position: fixed;

      inset: 0;

      z-index: 1500;

      display: flex;

      justify-content: center;
      align-items: center;

      padding:
        30px;

      background:
        rgba(4,3,10,0);

      backdrop-filter:
        blur(0);

      -webkit-backdrop-filter:
        blur(0);

      opacity: 0;

      pointer-events: none;

      transition:
        opacity 1.4s ease,
        background 1.4s ease,
        backdrop-filter 1.4s ease;

    }


    .secret-overlay.active {

      opacity: 1;

      background:
        rgba(4,3,10,0.78);

      backdrop-filter:
        blur(6px);

      -webkit-backdrop-filter:
        blur(6px);

      pointer-events: auto;

    }


    .secret-message {

      position: relative;

      z-index: 4;

      width: 100%;

      max-width: 680px;

      color:
        rgba(250,245,238,0.95);

      font-size:
        clamp(1.35rem,5vw,2.25rem);

      line-height: 1.65;

      text-align: center;

      opacity: 0;

      transform:
        translateY(18px)
        scale(0.97);

      text-shadow:
        0 0 30px
        rgba(210,170,255,0.14);

    }


    .secret-overlay.active
    .secret-message {

      animation:
        secretMessageAppear
        2.2s ease
        1.1s forwards;

    }


    .secret-orbit {

      position: absolute;

      top: 50%;
      left: 50%;

      width: 320px;
      height: 320px;

      transform:
        translate(-50%,-50%);

      pointer-events: none;

    }


    .secret-orbit-star {

      position: absolute;

      top: 50%;
      left: 50%;

      color:
        #fff8dc;

      font-size: 23px;

      opacity: 0;

      text-shadow:
        0 0 8px white,
        0 0 20px rgba(210,170,255,0.8);

    }


    .secret-overlay.active
    .orbit1 {

      animation:
        orbit1Move
        2s ease forwards;

    }


    .secret-overlay.active
    .orbit2 {

      animation:
        orbit2Move
        2s ease forwards;

    }


    .secret-overlay.active
    .orbit3 {

      animation:
        orbit3Move
        2s ease forwards;

    }


    .secret-overlay.active
    .orbit4 {

      animation:
        orbit4Move
        2s ease forwards;

    }


    .secret-close {

      position: absolute;

      bottom:
        calc(30px + var(--safe-bottom));

      left: 50%;

      transform:
        translateX(-50%);

      border: 0;

      background: transparent;

      color:
        rgba(255,255,255,0.28);

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      font-size:
        0.78rem;

      cursor: pointer;

      opacity: 0;

    }


    .secret-overlay.active
    .secret-close {

      animation:
        secretCloseAppear
        1s ease
        4s forwards;

    }


    /* ===================================== */
    /* YOUTUBE OCULTO                        */
    /* ===================================== */


    #youtubeHolder {

      position: fixed;

      width: 1px;
      height: 1px;

      left: -100px;
      top: -100px;

      overflow: hidden;

      opacity: 0.01;

      pointer-events: none;

    }


    #youtubePlayer {

      width: 1px;
      height: 1px;

    }


    /* ===================================== */
    /* RODAPÉ                                */
    /* ===================================== */


    .footer {

      margin-top: 42px;

      font-size: 0.62rem;

      letter-spacing:
        0.15em;

      color:
        rgba(255,255,255,0.14);

    }


    /* ===================================== */
    /* ANIMAÇÕES                             */
    /* ===================================== */


    @keyframes floatMoon {

      0%,
      100% {

        transform:
          translateY(0);

      }

      50% {

        transform:
          translateY(-10px);

      }

    }


    @keyframes moonPulse {

      0%,
      100% {

        transform:
          scale(1);

        opacity:
          0.90;

      }

      50% {

        transform:
          scale(1.05);

        opacity:
          1;

      }

    }


    @keyframes twinkle {

      from {

        opacity:
          0.42;

      }

      to {

        opacity:
          0.75;

      }

    }


    @keyframes mistMove {

      from {

        transform:
          translate(-53%,-50%);

      }

      to {

        transform:
          translate(-47%,-47%);

      }

    }


    @keyframes secretStarIdle {

      0%,
      100% {

        opacity:
          0.45;

        transform:
          scale(1);

      }

      50% {

        opacity:
          0.8;

        transform:
          scale(1.08);

      }

    }


    @keyframes secretStarFound {

      0% {

        transform:
          scale(1);

      }

      35% {

        transform:
          scale(1.65)
          rotate(20deg);

      }

      100% {

        transform:
          scale(1.3);

      }

    }


    @keyframes flashExplosion {

      0% {

        opacity: 0;

      }

      8% {

        opacity: 1;

      }

      28% {

        opacity: 0.75;

      }

      100% {

        opacity: 0;

      }

    }


    @keyframes shineTextBoom {

      0% {

        opacity: 0;

        transform:
          translate(-50%,-50%)
          scale(0.15)
          rotate(-8deg);

      }

      18% {

        opacity: 1;

        transform:
          translate(-50%,-50%)
          scale(1.25)
          rotate(4deg);

      }

      55% {

        opacity: 1;

        transform:
          translate(-50%,-50%)
          scale(1)
          rotate(-2deg);

      }

      100% {

        opacity: 0;

        transform:
          translate(-50%,-50%)
          scale(1.6)
          rotate(3deg);

      }

    }


    @keyframes restoreAppear {

      from {

        opacity: 0;

        transform:
          translateY(8px);

      }

      to {

        opacity: 1;

        transform:
          translateY(0);

      }

    }


    @keyframes piece1Boom {

      0% {

        opacity: 1;

        transform:
          translate(-30px,-30px)
          rotate(0deg);

      }

      100% {

        opacity: 0.95;

        transform:
          translate(-100px,-90px)
          rotate(-110deg);

      }

    }


    @keyframes piece2Boom {

      0% {

        opacity: 1;

        transform:
          translate(30px,-30px)
          rotate(0deg);

      }

      100% {

        opacity: 0.95;

        transform:
          translate(110px,-70px)
          rotate(130deg);

      }

    }


    @keyframes piece3Boom {

      0% {

        opacity: 1;

        transform:
          translate(-30px,30px)
          rotate(0deg);

      }

      100% {

        opacity: 0.95;

        transform:
          translate(-95px,95px)
          rotate(95deg);

      }

    }


    @keyframes piece4Boom {

      0% {

        opacity: 1;

        transform:
          translate(30px,30px)
          rotate(0deg);

      }

      100% {

        opacity: 0.95;

        transform:
          translate(105px,90px)
          rotate(-140deg);

      }

    }


    @keyframes secretMessageAppear {

      from {

        opacity: 0;

        transform:
          translateY(18px)
          scale(0.97);

      }

      to {

        opacity: 1;

        transform:
          translateY(0)
          scale(1);

      }

    }


    @keyframes orbit1Move {

      0% {

        opacity: 1;

        transform:
          translate(-150px,-120px)
          scale(1.4);

      }

      75% {

        opacity: 1;

      }

      100% {

        opacity: 0.8;

        transform:
          translate(-120px,-100px)
          scale(0.9);

      }

    }


    @keyframes orbit2Move {

      0% {

        opacity: 1;

        transform:
          translate(150px,-110px)
          scale(1.4);

      }

      75% {

        opacity: 1;

      }

      100% {

        opacity: 0.8;

        transform:
          translate(120px,-100px)
          scale(0.9);

      }

    }


    @keyframes orbit3Move {

      0% {

        opacity: 1;

        transform:
          translate(-140px,120px)
          scale(1.4);

      }

      75% {

        opacity: 1;

      }

      100% {

        opacity: 0.8;

        transform:
          translate(-110px,95px)
          scale(0.9);

      }

    }


    @keyframes orbit4Move {

      0% {

        opacity: 1;

        transform:
          translate(145px,125px)
          scale(1.4);

      }

      75% {

        opacity: 1;

      }

      100% {

        opacity: 0.8;

        transform:
          translate(110px,95px)
          scale(0.9);

      }

    }


    @keyframes secretCloseAppear {

      from {

        opacity: 0;

      }

      to {

        opacity: 1;

      }

    }


    /* ===================================== */
    /* IPHONE                                */
    /* ===================================== */


    @media
    (max-width: 600px) {

      main {

        padding-top:
          calc(
            42px +
            var(--safe-top)
          );

        padding-bottom:
          calc(
            40px +
            var(--safe-bottom)
          );

      }


      .spotify-search {

        flex-direction:
          column;

      }


      .spotify-search button {

        width: 100%;

      }


      .secret-star {

        width: 46px;
        height: 46px;

        font-size: 16px;

      }


      .secret-star-1 {

        top:
          calc(10% + var(--safe-top));

        left: 5%;

      }


      .secret-star-2 {

        top:
          calc(19% + var(--safe-top));

        right: 5%;

      }


      .secret-star-3 {

        bottom:
          calc(20% + var(--safe-bottom));

        left: 4%;

      }


      .secret-star-4 {

        bottom:
          calc(12% + var(--safe-bottom));

        right: 5%;

      }


      .secret-message {

        font-size:
          clamp(1.25rem,5.5vw,1.8rem);

        padding:
          0 5px;

      }


      .secret-orbit {

        width: 260px;
        height: 260px;

      }

    }

  </style>

</head>


<body>


  <div class="stars"></div>

  <div class="mist"></div>


  <!-- ================================= -->
  <!-- QUATRO ESTRELAS SECRETAS         -->
  <!-- ================================= -->


  <button
    class="secret-star secret-star-1"
    data-secret-star="1"
    aria-label="estrela"
  >
    ✦
  </button>


  <button
    class="secret-star secret-star-2"
    data-secret-star="2"
    aria-label="estrela"
  >
    ✦
  </button>


  <button
    class="secret-star secret-star-3"
    data-secret-star="3"
    aria-label="estrela"
  >
    ✦
  </button>


  <button
    class="secret-star secret-star-4"
    data-secret-star="4"
    aria-label="estrela"
  >
    ✦
  </button>


  <!-- ================================= -->
  <!-- SEGREDO                            -->
  <!-- ================================= -->


  <div
    id="secretOverlay"
    class="secret-overlay"
  >


    <div class="secret-orbit">

      <span class="secret-orbit-star orbit1">
        ✦
      </span>

      <span class="secret-orbit-star orbit2">
        ✦
      </span>

      <span class="secret-orbit-star orbit3">
        ✦
      </span>

      <span class="secret-orbit-star orbit4">
        ✦
      </span>

    </div>


    <div class="secret-message">

      Talvez algumas pessoas
      não iluminem o caminho.

      <br><br>

      Só fazem a noite
      parecer menos vazia.

    </div>


    <button
      id="secretClose"
      class="secret-close"
      type="button"
    >

      voltar para a noite

    </button>


  </div>


  <!-- ================================= -->
  <!-- EXPLOSÃO                           -->
  <!-- ================================= -->


  <div
    id="explosionFlash"
    class="explosion-flash"
  ></div>


  <div
    id="shineText"
    class="shine-text"
  >

    SHINEEEEEEE!

  </div>


  <!-- ================================= -->
  <!-- YOUTUBE                            -->
  <!-- ================================= -->


  <div id="youtubeHolder">

    <div id="youtubePlayer"></div>

  </div>


  <main>


    <div class="scene">


      <!-- ================================= -->
      <!-- LUA                               -->
      <!-- ================================= -->


      <div
        id="moonStage"
        class="moon-stage"
      >


        <div
          id="moonButton"
          class="moon-wrapper"
          role="button"
          tabindex="0"
          aria-label="Lua"
        >


          <div class="moon-halo"></div>


          <div class="moon">

            <span class="crater c1"></span>

            <span class="crater c2"></span>

            <span class="crater c3"></span>

            <span class="crater c4"></span>

            <span class="crater c5"></span>

          </div>


        </div>


        <div class="moon-pieces">

          <div class="piece piece1"></div>

          <div class="piece piece2"></div>

          <div class="piece piece3"></div>

          <div class="piece piece4"></div>

        </div>


      </div>


      <!-- ================================= -->
      <!-- ANIVERSÁRIO                       -->
      <!-- ================================= -->


      <div
        id="birthday"
        class="birthday fade-item"
      >

        Feliz aniversário, Nana.

      </div>


      <div
        id="moonHint"
        class="moon-hint"
      >

        ps: talvez a lua faça alguma coisa

      </div>


      <button
        id="restoreMoon"
        class="restore-button"
        type="button"
      >

        ok, traz a lua de volta

      </button>


      <!-- ================================= -->
      <!-- SPOTIFY                           -->
      <!-- ================================= -->


      <div
        id="spotifyArea"
        class="spotify-section fade-item"
      >


        <div class="spotify-label">

          Desassocie:

        </div>


        <div class="spotify-search">


          <input
            id="spotifyInput"
            type="text"
            placeholder="uma música ou playlist do Spotify..."
            autocomplete="off"
          >


          <button
            type="button"
            onclick="loadSpotify()"
          >

            ouvir

          </button>


        </div>


        <div id="spotifyMessage"></div>


        <div id="spotifyPlayer"></div>


      </div>


      <div class="footer">

        for one quiet night

      </div>


    </div>


  </main>


  <script
    src="https://www.youtube.com/iframe_api"
  ></script>


  <script>


    /* =====================================
       YOUTUBE
    ===================================== */


    const YOUTUBE_VIDEO_ID =
      "ITHdc8hK3oQ";


    const BAKUGOU_START_SECONDS =
      1.5;


    let youtubePlayer =
      null;


    let youtubeReady =
      false;


    function onYouTubeIframeAPIReady() {


      youtubePlayer =
        new YT.Player(
          "youtubePlayer",
          {


            height:
              "1",


            width:
              "1",


            videoId:
              YOUTUBE_VIDEO_ID,


            playerVars:
              {

                controls: 0,

                rel: 0,

                playsinline: 1,

                origin:
                  window.location.origin

              },


            events:
              {

                onReady:
                  function () {

                    youtubeReady =
                      true;

                  }

              }


          }
        );

    }


    function playBakugou() {


      if (
        !youtubeReady ||
        !youtubePlayer
      ) {

        return;

      }


      try {


        youtubePlayer.unMute();


        youtubePlayer.setVolume(
          100
        );


        youtubePlayer.seekTo(
          BAKUGOU_START_SECONDS,
          true
        );


        youtubePlayer.playVideo();


      }

      catch (
        error
      ) {

        console.log(
          error
        );

      }

    }


    function stopBakugou() {


      if (
        youtubeReady &&
        youtubePlayer
      ) {


        try {

          youtubePlayer.stopVideo();

        }

        catch (
          error
        ) {

          console.log(
            error
          );

        }

      }

    }


    /* =====================================
       ENTRADA
    ===================================== */


    window.addEventListener(
      "load",
      function () {


        setTimeout(
          function () {


            document
              .getElementById(
                "birthday"
              )
              .classList
              .add(
                "show"
              );


          },
          800
        );


        setTimeout(
          function () {


            document
              .getElementById(
                "spotifyArea"
              )
              .classList
              .add(
                "show"
              );


          },
          1800
        );


        setTimeout(
          function () {


            document
              .getElementById(
                "moonHint"
              )
              .classList
              .add(
                "show"
              );


          },
          3500
        );


      }
    );


    /* =====================================
       EXPLOSÃO DA LUA
    ===================================== */


    const moonStage =

      document.getElementById(
        "moonStage"
      );


    const moonButton =

      document.getElementById(
        "moonButton"
      );


    const explosionFlash =

      document.getElementById(
        "explosionFlash"
      );


    const shineText =

      document.getElementById(
        "shineText"
      );


    const restoreMoon =

      document.getElementById(
        "restoreMoon"
      );


    const moonHint =

      document.getElementById(
        "moonHint"
      );


    let moonDestroyed =
      false;


    function explodeMoon() {


      if (
        moonDestroyed
      ) {

        return;

      }


      moonDestroyed =
        true;


      playBakugou();


      explosionFlash
        .classList
        .remove(
          "boom"
        );


      shineText
        .classList
        .remove(
          "boom"
        );


      void explosionFlash.offsetWidth;


      explosionFlash
        .classList
        .add(
          "boom"
        );


      shineText
        .classList
        .add(
          "boom"
        );


      moonStage
        .classList
        .add(
          "exploded"
        );


      moonHint.style.opacity =
        "0";


      if (
        navigator.vibrate
      ) {


        navigator.vibrate(
          [
            60,
            35,
            90
          ]
        );


      }


      setTimeout(
        function () {


          restoreMoon
            .classList
            .add(
              "visible"
            );


        },
        900
      );

    }


    function rebuildMoon() {


      stopBakugou();


      restoreMoon
        .classList
        .remove(
          "visible"
        );


      moonStage
        .classList
        .remove(
          "exploded"
        );


      moonDestroyed =
        false;


      setTimeout(
        function () {

          moonHint.style.opacity =
            "";

        },
        700
      );

    }


    moonButton
      .addEventListener(
        "click",
        explodeMoon
      );


    moonButton
      .addEventListener(
        "keydown",
        function (
          event
        ) {


          if (
            event.key === "Enter" ||
            event.key === " "
          ) {


            event.preventDefault();


            explodeMoon();

          }

        }
      );


    restoreMoon
      .addEventListener(
        "click",
        rebuildMoon
      );


    /* =====================================
       SEGREDO DAS 4 ESTRELAS
    ===================================== */


    const secretStars =
      document.querySelectorAll(
        ".secret-star"
      );


    const secretOverlay =
      document.getElementById(
        "secretOverlay"
      );


    const secretClose =
      document.getElementById(
        "secretClose"
      );


    const foundStars =
      new Set();


    let secretUnlocked =
      false;


    secretStars.forEach(
      function (
        star
      ) {


        star.addEventListener(
          "click",
          function () {


            if (
              secretUnlocked
            ) {

              return;

            }


            const number =
              star.dataset.secretStar;


            if (
              foundStars.has(
                number
              )
            ) {

              return;

            }


            foundStars.add(
              number
            );


            star
              .classList
              .add(
                "found"
              );


            star
              .classList
              .add(
                "used"
              );


            if (
              navigator.vibrate
            ) {

              navigator.vibrate(
                25
              );

            }


            if (
              foundStars.size === 4
            ) {


              secretUnlocked =
                true;


              setTimeout(
                function () {


                  openSecret();

                },
                700
              );

            }

          }
        );


      }
    );


    function openSecret() {


      stopBakugou();


      secretOverlay
        .classList
        .add(
          "active"
        );


      document.body.style.overflow =
        "hidden";

    }


    function closeSecret() {


      secretOverlay
        .classList
        .remove(
          "active"
        );


      document.body.style.overflow =
        "";


      secretStars.forEach(
        function (
          star
        ) {


          star.style.opacity =
            "0.18";


        }
      );

    }


    secretClose
      .addEventListener(
        "click",
        closeSecret
      );


    /* =====================================
       SPOTIFY
    ===================================== */


    function loadSpotify() {


      const input =

        document
          .getElementById(
            "spotifyInput"
          )
          .value
          .trim();


      const message =

        document
          .getElementById(
            "spotifyMessage"
          );


      const player =

        document
          .getElementById(
            "spotifyPlayer"
          );


      const match =

        input.match(

          /open\.spotify\.com\/(playlist|track|album|artist|show|episode)\/([a-zA-Z0-9]+)/

        );


      if (
        !match
      ) {


        player.innerHTML =
          "";


        player
          .classList
          .remove(
            "visible"
          );


        message.textContent =
          "esse link não parece ser do Spotify 🌙";


        return;

      }


      const type =
        match[1];


      const id =
        match[2];


      let height =
        152;


      if (
        type === "playlist" ||
        type === "album" ||
        type === "artist"
      ) {

        height =
          352;

      }


      const embedURL =

        "https://open.spotify.com/embed/" +
        type +
        "/" +
        id;


      message.textContent =
        "";


      player.innerHTML =

        `
        <iframe
          src="${embedURL}"
          height="${height}"
          allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
          loading="lazy">
        </iframe>
        `;


      setTimeout(
        function () {


          player
            .classList
            .add(
              "visible"
            );


        },
        50
      );

    }


    document
      .getElementById(
        "spotifyInput"
      )
      .addEventListener(
        "keydown",
        function (
          event
        ) {


          if (
            event.key ===
              "Enter"
          ) {


            loadSpotify();

          }

        }
      );


  </script>


</body>

</html>
