<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Para Nana 🌙</title>

  <style>
    :root {
      --bg1: #05060c;
      --bg2: #100b19;
      --bg3: #21122d;

      --text: #f6f1ea;
      --soft: rgba(246, 241, 234, 0.72);
      --faint: rgba(246, 241, 234, 0.38);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      overflow-x: hidden;

      background:
        radial-gradient(
          circle at 20% 15%,
          rgba(100, 60, 160, 0.22),
          transparent 30%
        ),
        radial-gradient(
          circle at 80% 25%,
          rgba(190, 80, 130, 0.11),
          transparent 28%
        ),
        radial-gradient(
          circle at 50% 80%,
          rgba(120, 70, 180, 0.13),
          transparent 38%
        ),
        linear-gradient(
          180deg,
          var(--bg1) 0%,
          var(--bg2) 48%,
          var(--bg3) 100%
        );

      color: var(--text);

      font-family:
        Georgia,
        "Times New Roman",
        serif;
    }

    /* ESTRELAS */

    .stars,
    .stars::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
    }

    .stars {
      background-image:
        radial-gradient(2px 2px at 12% 18%, white, transparent 60%),
        radial-gradient(1px 1px at 24% 72%, white, transparent 60%),
        radial-gradient(2px 2px at 78% 22%, white, transparent 60%),
        radial-gradient(1px 1px at 67% 68%, white, transparent 60%),
        radial-gradient(2px 2px at 88% 54%, white, transparent 60%),
        radial-gradient(1px 1px at 34% 38%, white, transparent 60%),
        radial-gradient(2px 2px at 55% 13%, white, transparent 60%),
        radial-gradient(1px 1px at 44% 85%, white, transparent 60%),
        radial-gradient(2px 2px at 8% 56%, white, transparent 60%),
        radial-gradient(1px 1px at 92% 12%, white, transparent 60%);

      opacity: 0.55;

      animation:
        twinkle 8s ease-in-out infinite alternate;
    }

    .stars::before {
      background-image:
        radial-gradient(1px 1px at 16% 38%, white, transparent 60%),
        radial-gradient(2px 2px at 72% 82%, white, transparent 60%),
        radial-gradient(1px 1px at 62% 48%, white, transparent 60%),
        radial-gradient(1px 1px at 83% 74%, white, transparent 60%),
        radial-gradient(1px 1px at 29% 15%, white, transparent 60%);

      opacity: 0.45;

      animation:
        twinkle 12s ease-in-out infinite alternate-reverse;
    }

    /* NÉVOA */

    .mist {
      position: fixed;

      width: 65vw;
      height: 30vw;

      left: 50%;
      top: 42%;

      transform: translate(-50%, -50%);

      background:
        radial-gradient(
          circle at 30% 50%,
          rgba(215, 170, 255, 0.09),
          transparent 45%
        ),
        radial-gradient(
          circle at 70% 45%,
          rgba(255, 175, 205, 0.07),
          transparent 40%
        );

      filter: blur(40px);

      pointer-events: none;

      animation:
        mistMove 12s ease-in-out infinite alternate;
    }

    /* CONTEÚDO */

    main {
      position: relative;
      z-index: 2;

      min-height: 100vh;

      display: flex;
      justify-content: center;
      align-items: center;

      padding:
        70px 20px
        90px;
    }

    .scene {
      width: 100%;
      max-width: 820px;

      position: relative;

      display: flex;
      flex-direction: column;
      align-items: center;

      text-align: center;
    }

    /* LUA */

    .moon-wrapper {
      width: 260px;
      height: 260px;

      position: relative;

      display: flex;
      justify-content: center;
      align-items: center;

      margin-bottom: 32px;

      animation:
        floatMoon 6s ease-in-out infinite;
    }

    .moon-halo {
      position: absolute;

      width: 255px;
      height: 255px;

      border-radius: 50%;

      background:
        radial-gradient(
          circle,
          rgba(255, 240, 210, 0.17) 0%,
          rgba(200, 160, 255, 0.13) 35%,
          rgba(255, 160, 210, 0.05) 58%,
          transparent 75%
        );

      filter: blur(9px);

      animation:
        moonPulse 6s ease-in-out infinite;
    }

    .moon {
      width: 158px;
      height: 158px;

      position: relative;

      border-radius: 50%;

      overflow: hidden;

      background:
        radial-gradient(
          circle at 28% 25%,
          #fffaf0 0%,
          #f7ecd6 37%,
          #ebdcbc 70%,
          #d3c09d 100%
        );

      box-shadow:
        inset -20px -14px 0 rgba(170, 150, 120, 0.14),
        inset 10px 9px 0 rgba(255, 255, 255, 0.12),
        0 0 25px rgba(255, 240, 210, 0.22),
        0 0 70px rgba(200, 160, 255, 0.11);
    }

    .crater {
      position: absolute;

      border-radius: 50%;

      background:
        rgba(165, 140, 105, 0.14);

      box-shadow:
        inset 2px 2px 4px
        rgba(255, 255, 255, 0.08);
    }

    .c1 {
      width: 25px;
      height: 25px;
      top: 34px;
      left: 38px;
    }

    .c2 {
      width: 14px;
      height: 14px;
      top: 80px;
      left: 96px;
    }

    .c3 {
      width: 18px;
      height: 18px;
      top: 102px;
      left: 44px;
    }

    .c4 {
      width: 10px;
      height: 10px;
      top: 53px;
      left: 102px;
    }

    .c5 {
      width: 8px;
      height: 8px;
      top: 120px;
      left: 88px;
    }

    /* BRILHOS */

    .spark {
      position: absolute;

      color:
        rgba(255, 255, 255, 0.65);

      font-size: 18px;

      user-select: none;

      animation:
        spark 6s ease-in-out infinite;
    }

    .spark1 {
      top: 20%;
      left: 15%;
    }

    .spark2 {
      top: 14%;
      right: 17%;
      animation-delay: 1.4s;
    }

    .spark3 {
      top: 46%;
      left: 10%;
      animation-delay: 2.7s;
    }

    .spark4 {
      top: 51%;
      right: 12%;
      animation-delay: 4s;
    }

    /* TEXTO */

    .fade-item {
      opacity: 0;

      transform:
        translateY(14px);

      transition:
        opacity 1.5s ease,
        transform 1.5s ease;
    }

    .fade-item.show {
      opacity: 1;

      transform:
        translateY(0);
    }

    .birthday {
      font-size:
        clamp(1.8rem, 4.5vw, 3rem);

      line-height: 1.35;

      font-weight: 500;

      color: var(--text);

      letter-spacing: 0.2px;
    }

    /* SPOTIFY */

    .spotify-section {
      width: 100%;
      max-width: 560px;

      margin-top: 42px;
    }

    .spotify-label {
      margin-bottom: 13px;

      font-size: 0.78rem;

      letter-spacing: 0.08em;

      text-transform: lowercase;

      color:
        rgba(255, 255, 255, 0.34);
    }

    .spotify-search {
      display: flex;

      gap: 9px;

      width: 100%;
    }

    .spotify-search input {
      flex: 1;

      min-width: 0;

      padding:
        13px 17px;

      border:
        1px solid
        rgba(255, 255, 255, 0.11);

      border-radius: 30px;

      outline: none;

      background:
        rgba(255, 255, 255, 0.045);

      backdrop-filter:
        blur(10px);

      color: white;

      font-size: 0.9rem;

      transition:
        border 0.25s ease,
        background 0.25s ease;
    }

    .spotify-search input:focus {
      border-color:
        rgba(210, 170, 255, 0.35);

      background:
        rgba(255, 255, 255, 0.065);
    }

    .spotify-search input::placeholder {
      color:
        rgba(255, 255, 255, 0.30);
    }

    .spotify-search button {
      padding:
        12px 20px;

      border: 0;

      border-radius: 30px;

      cursor: pointer;

      background:
        rgba(245, 238, 225, 0.90);

      color: #15131a;

      font-family: inherit;

      font-size: 0.9rem;

      transition:
        transform 0.2s ease,
        background 0.2s ease;
    }

    .spotify-search button:hover {
      transform:
        translateY(-1px);

      background:
        white;
    }

    #spotifyMessage {
      min-height: 18px;

      margin-top: 10px;

      font-size: 0.78rem;

      color:
        rgba(255, 255, 255, 0.42);
    }

    #spotifyPlayer {
      width: 100%;

      margin-top: 18px;

      opacity: 0;

      transform:
        translateY(12px);

      transition:
        opacity 0.8s ease,
        transform 0.8s ease;
    }

    #spotifyPlayer.visible {
      opacity: 1;

      transform:
        translateY(0);
    }

    #spotifyPlayer iframe {
      display: block;

      width: 100%;

      border: 0;

      border-radius: 14px;
    }

    /* RODAPÉ */

    .footer {
      margin-top: 44px;

      font-size: 0.64rem;

      letter-spacing: 0.15em;

      text-transform: uppercase;

      color:
        rgba(255, 255, 255, 0.15);
    }

    /* ANIMAÇÕES */

    @keyframes floatMoon {

      0%,
      100% {
        transform:
          translateY(0);
      }

      50% {
        transform:
          translateY(-10px);
      }

    }

    @keyframes moonPulse {

      0%,
      100% {
        transform:
          scale(1);

        opacity: 0.90;
      }

      50% {
        transform:
          scale(1.05);

        opacity: 1;
      }

    }

    @keyframes twinkle {

      from {
        opacity: 0.42;
      }

      to {
        opacity: 0.75;
      }

    }

    @keyframes mistMove {

      from {
        transform:
          translate(-53%, -50%);
      }

      to {
        transform:
          translate(-47%, -47%);
      }

    }

    @keyframes spark {

      0%,
      100% {
        opacity: 0.25;

        transform:
          translateY(0)
          scale(0.9);
      }

      50% {
        opacity: 0.85;

        transform:
          translateY(-4px)
          scale(1.08);
      }

    }

    /* CELULAR */

    @media (max-width: 600px) {

      main {
        padding:
          55px 17px
          70px;
      }

      .moon-wrapper {
        width: 210px;
        height: 210px;

        margin-bottom: 26px;
      }

      .moon-halo {
        width: 210px;
        height: 210px;
      }

      .moon {
        width: 132px;
        height: 132px;
      }

      .c1 {
        width: 20px;
        height: 20px;
        top: 28px;
        left: 31px;
      }

      .c2 {
        width: 12px;
        height: 12px;
        top: 66px;
        left: 81px;
      }

      .c3 {
        width: 15px;
        height: 15px;
        top: 85px;
        left: 35px;
      }

      .c4 {
        width: 8px;
        height: 8px;
        top: 44px;
        left: 85px;
      }

      .c5 {
        width: 7px;
        height: 7px;
        top: 99px;
        left: 73px;
      }

      .spotify-section {
        margin-top: 34px;
      }

      .spotify-search {
        flex-direction: column;
      }

      .spotify-search button {
        width: 100%;
      }

    }

  </style>
</head>

<body>

  <div class="stars"></div>

  <div class="mist"></div>

  <main>

    <div class="scene">

      <span class="spark spark1">✦</span>
      <span class="spark spark2">✦</span>
      <span class="spark spark3">✦</span>
      <span class="spark spark4">✦</span>

      <div class="moon-wrapper">

        <div class="moon-halo"></div>

        <div class="moon">

          <span class="crater c1"></span>
          <span class="crater c2"></span>
          <span class="crater c3"></span>
          <span class="crater c4"></span>
          <span class="crater c5"></span>

        </div>

      </div>

      <div
        id="birthday"
        class="birthday fade-item"
      >
        Feliz aniversário, Nana.
      </div>

      <div
        id="spotifyArea"
        class="spotify-section fade-item"
      >

        <div class="spotify-label">
          Desassocie:
        </div>

        <div class="spotify-search">

          <input
            id="spotifyInput"
            type="text"
            placeholder="cole uma música ou playlist do Spotify..."
            autocomplete="off"
          >

          <button
            type="button"
            onclick="loadSpotify()"
          >
            ouvir
          </button>

        </div>

        <div id="spotifyMessage"></div>

        <div id="spotifyPlayer"></div>

      </div>

      <div class="footer">
        for one quiet night
      </div>

    </div>

  </main>

  <script>

    window.addEventListener(
      "load",
      function () {

        setTimeout(
          function () {

            document
              .getElementById("birthday")
              .classList.add("show");

          },
          1200
        );

        setTimeout(
          function () {

            document
              .getElementById("spotifyArea")
              .classList.add("show");

          },
          3200
        );

      }
    );


    function loadSpotify() {

      const input =
        document
          .getElementById("spotifyInput")
          .value
          .trim();

      const message =
        document
          .getElementById("spotifyMessage");

      const player =
        document
          .getElementById("spotifyPlayer");


      const match =
        input.match(
          /open\.spotify\.com\/(playlist|track|album|artist|show|episode)\/([a-zA-Z0-9]+)/
        );


      if (!match) {

        player.innerHTML = "";

        player.classList.remove("visible");

        message.textContent =
          "esse link não parece ser do Spotify 🌙";

        return;

      }


      const type =
        match[1];

      const id =
        match[2];


      let height =
        152;


      if (
        type === "playlist" ||
        type === "album" ||
        type === "artist"
      ) {

        height =
          352;

      }


      const embedURL =
        "https://open.spotify.com/embed/" +
        type +
        "/" +
        id;


      message.textContent =
        "";


      player.innerHTML =
        `
        <iframe
          src="${embedURL}"
          height="${height}"
          allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
          loading="lazy">
        </iframe>
        `;


      setTimeout(
        function () {

          player
            .classList
            .add("visible");

        },
        50
      );

    }


    document
      .getElementById("spotifyInput")
      .addEventListener(
        "keydown",
        function (event) {

          if (event.key === "Enter") {

            loadSpotify();

          }

        }
      );

  </script>

</body>

</html>
